server {
    listen 80;
    server_name 47.129.154.125;

    location = /portfolio {
        return 301 /portfolio/;
    }

    location /portfolio/api/ {
        auth_basic "Private Portfolio";
        auth_basic_user_file /etc/nginx/portfolio-dashboard.htpasswd;
        proxy_pass http://127.0.0.1:8791/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        client_max_body_size 256k;
    }

    location /portfolio/ {
        auth_basic "Private Portfolio";
        auth_basic_user_file /etc/nginx/portfolio-dashboard.htpasswd;
        alias /var/www/portfolio-news-dashboard/;
        try_files $uri $uri/ /portfolio/index.html;
        add_header Cache-Control "no-store" always;
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;
    }

    location / {
        proxy_pass http://0.0.0.0:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }
}
